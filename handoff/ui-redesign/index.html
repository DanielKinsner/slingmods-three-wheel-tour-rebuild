<script>
const tabs=[...document.querySelectorAll('[role=tab]')];
function select(tab){for(const t of tabs){const on=t===tab;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1}const img=document.querySelector('#image');img.src=tab.dataset.image+'.jpg';img.alt=tab.dataset.label;document.querySelector('#caption').textContent=tab.dataset.label}
for(const tab of tabs){tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',e=>{const moves={ArrowRight:1,ArrowLeft:-1};if(e.key in moves){e.preventDefault();const next=tabs[(tabs.indexOf(tab)+moves[e.key]+tabs.length)%tabs.length];select(next);next.focus()}})}select(tabs[0]);
</script></body></html>
