<!doctype html><html><head><meta charset="UTF-8"><style>body{margin:0;background:#d1d5d8}canvas{display:block}#label{position:fixed;left:20px;bottom:20px;padding:12px;background:#121820db;color:white;font:16px system-ui;pointer-events:none}</style></head><body><div id="label">Front fascia refinement · neutral assembled car</div><script type="module">
import * as THREE from 'three';import {GLTFLoader}from 'three/addons/loaders/GLTFLoader.js';import {RoomEnvironment}from 'three/addons/environments/RoomEnvironment.js';import {SignatureFinishPresenter,SignatureProducts,loadSignatureShowroom}from '/src/presentation/signature-art.ts';import{SuspensionPresenter}from '/src/presentation/suspension.ts';import{RearPresenter}from '/src/presentation/rear.ts';
const loader=new GLTFLoader(),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#aeb5bb');const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
const hemi=new THREE.HemisphereLight('#f6f7fa','#77736e',2);scene.add(hemi);const key=new THREE.DirectionalLight('#fff7ef',3);key.position.set(-3,5,-3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-7;key.shadow.camera.right=7;key.shadow.camera.top=7;key.shadow.camera.bottom=-7;key.shadow.bias=-.0003;scene.add(key);const fill=new THREE.DirectionalLight('#cfdded',1.5);fill.position.set(4,2,2);scene.add(fill);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,60);camera.position.set(4.6,2.0,-5.8);camera.lookAt(0,.62,0);
const asset=await loader.loadAsync('/assets/front-refinement/slingshot-front-refined.glb'),car=asset.scene;car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(car);const room=await loadSignatureShowroom(loader);scene.add(room);const finish=new SignatureFinishPresenter(car),products=await SignatureProducts.load(loader,car),suspension=await SuspensionPresenter.load(loader,car),rig=await fetch('/assets/vehicles/slingshot-p04a1-rear-rig.json').then(r=>r.json()),rear=new RearPresenter(car,rig);const baseline=await loader.loadAsync('/assets/p08b/slingshot-signature.glb');baseline.scene.visible=false;scene.add(baseline.scene);baseline.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});

const wheelBase=['front_left_steer','front_right_steer','rear_spin'].map(n=>({node:car.getObjectByName(n),position:car.getObjectByName(n).position.clone(),rotation:car.getObjectByName(n).quaternion.clone()}));
window.art={scene,car,room,finish,products,suspension,renderer,camera,view,baseline:baseline.scene,ready:true,pose(travel=0,steer=0,height=0){car.position.y=height;wheelBase.forEach((b,i)=>{b.node.position.copy(b.position);b.node.position.y+=travel-height;b.node.quaternion.copy(b.rotation);if(i<2)b.node.rotateY(steer)});rear.update({localCenter:{x:rig.wheelCenter[0],y:rig.wheelCenter[1]+travel-height,z:rig.wheelCenter[2]},spin:0});suspension.update();return suspension.inspect()},async set(f,ids=[]){await finish.set(f);products.set(ids);suspension.set(ids.includes('SM-3223'))},baselineView(value){car.visible=!value;baseline.scene.visible=value},stats(){return{...renderer.info.memory,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,finish:finish.inspect(),products:products.inspect()}}};renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
