<!doctype html><html><head><meta charset="UTF-8"><style>body{margin:0;background:#777}canvas{display:block}#label{position:fixed;left:20px;bottom:20px;background:#151719de;color:white;font:15px system-ui;padding:10px}</style></head><body><div id="label">Showroom refinement · authored runtime assets</div><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{inspectionEnvironment}from'/src/presentation/inspection.ts';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#777d80');const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(inspectionEnvironment(true),.04).texture;scene.environmentIntensity=.88;
const hemi=new THREE.HemisphereLight(0xf3f4f5,0x6f6a66,1.1),key=new THREE.DirectionalLight(0xfffbf3,2.1),fill=new THREE.DirectionalLight(0xe5edf7,.8),rim=new THREE.DirectionalLight(0xffffff,.95);key.position.set(-3,6,-4);fill.position.set(5,3,-2);rim.position.set(1,4,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:.1,far:25});key.shadow.normalBias=.012;scene.add(hemi,key,fill,rim,key.target);

window.refined={ready:true,scene,room,old,car,camera,curtain,door,renderer,view,set({oldView=false,showCar=true,open=0}={}){old.visible=oldView;room.visible=!oldView;car.visible=showCar;curtain.position.y=3.35*open;curtain.scale.y=1-.975*open},inspect(){return {meshes:renderer.info.memory.geometries,textures:renderer.info.memory.textures,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,door:door.position.toArray(),curtain:curtain.position.toArray(),curtainScale:curtain.scale.toArray(),doorBounds:new THREE.Box3().setFromObject(door).min.toArray()}}};view([0,2.4,-7.8],[0,1.1,2.2],'Refined showroom');renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
